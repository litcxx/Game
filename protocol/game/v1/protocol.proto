// Протокол клиент ↔ сервер, версия 1 (MVP).
//
// Транспорт: WebSocket поверх TLS (wss://<host>/ws), только бинарные кадры.
// Один кадр = одно сообщение: клиент шлёт ClientMessage, сервер — ServerMessage.
// Границы сообщений даёт WebSocket, собственного фрейминга нет.
//
// Константы (меняются только вместе с версией протокола):
//   PROTOCOL_VERSION = ProtocolVersion.PROTOCOL_VERSION_CURRENT (ниже, у Hello)
//   UNITS_PER_CELL   = 100   позиция в целых единицах, 1 клетка = 100 единиц
//
// Соглашения:
//   * id = 0 означает «нет» (игрока, фракции, цели): в proto3 это значение
//     по умолчанию, поэтому настоящие id начинаются с 1;
//   * тик — шаг серверной симуляции, GameConfig.tick_rate в секунду (60);
//     время сервера всегда в тиках, и имена таких полей оканчиваются на tick;
//   * input_seq — номер кадра ввода (InputFrame) в пределах соединения: 1, 2,
//     3…, его выдаёт клиент. Поле, которое ссылается на кадр ввода, называется
//     <роль>_input_seq (last_input_seq); других имён у этого номера нет;
//   * индекс клетки = y * map_width + x;
//   * enum-значение 0 = UNSPECIFIED и смысла не несёт.
//
// Номера полей 1–15 кодируются одним байтом тега: горячие сообщения
// (Input, Snapshot) и их поля держим в этом диапазоне.
//
// Туман войны: сервер шлёт получателю только то, что видит его фракция.
// Источники зрения — живые игроки фракции и её клетки, радиус задаёт сервер
// (vision_radius в конфиге, 300 = 3 клетки). Клетка видна, если её центр в
// радиусе от источника; игрок и снаряд видны, если видна клетка под ними;
// событие — если видны все игроки, которых оно называет. Себя получатель
// видит всегда. Видимость приходит разностью (Snapshot.revealed /
// Snapshot.hidden); клетку, которую получатель видел, но сейчас не видит,
// клиент показывает в последнем известном состоянии.

syntax = "proto3";

package game.v1;

// ============================================================================
// Конверты
// ============================================================================

message ClientMessage {
  // Номер запроса, выбирает клиент (обычно счётчик). Если сообщение вызвало
  // ошибку, сервер вернёт его в ServerError.request_id. 0 = не задан.
  uint32 request_id = 1;

  oneof payload {
    Hello hello = 2;
    SpawnRequest spawn = 3;
    Input input = 4;
    Ping ping = 5;
  }
}

message ServerMessage {
  oneof payload {
    Welcome welcome = 1;
    MapState map_state = 2;
    Roster roster = 3;
    Snapshot snapshot = 4;
    Pong pong = 5;
    ServerError error = 6;
    FactionScores faction_scores = 7;
  }
}

// ============================================================================
// Подключение
// ============================================================================

// Первое сообщение клиента в каждом соединении. Любое другое сообщение до него
// и повторный Hello в том же соединении — UNEXPECTED_MESSAGE (fatal).
message Hello {
  uint32 protocol_version = 1;  // PROTOCOL_VERSION_CURRENT клиента; иная — PROTOCOL_VERSION (fatal)
  string name = 2;              // ник: сервер обрезает пробелы по краям, затем 1–16 символов
                                //   (не байт) без управляющих и невидимых — иначе INVALID_NAME (fatal);
                                //   новому игроку — не занятый другим персонажем (без учёта регистра)
  string session_token = 3;     // токен из прошлого Welcome: вернёт того же персонажа (name тогда
                                //   не меняется); пусто или неизвестный токен = новый персонаж
  string client_build = 4;      // сборка клиента, только для логов
}

// Версия протокола — одна на обе стороны: клиент и сервер берут её из
// сгенерированного кода. Увеличивается, когда изменение требует нового клиента;
// вкладка со старым клиентом тогда получает PROTOCOL_VERSION (fatal).
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_CURRENT = 2;  // 2: появление в столице, SpawnRequest без клетки
}

message Welcome {
  uint32 player_id = 1;           // публичный id, ≥ 1, не переиспользуется
  string session_token = 2;       // секрет для переподключения (32 hex-символа, 128 бит), другим не
                                  //   отправляется; сервер хранит только его SHA-256
  bool resumed = 3;               // true = персонаж ещё был в мире (грейс-период или другая вкладка):
                                  //   то же тело в том же состоянии. false = новый персонаж или
                                  //   возвращение после грейс-периода (тот же player_id, NOT_SPAWNED)
  uint32 server_tick = 4;         // текущий тик сервера
  GameConfig config = 5;
  repeated Faction factions = 6;
  repeated Ability abilities = 7;  // панель способностей по порядку: abilities[0] — клавиша 1
  MapDefinition map = 8;           // статическое знание о карте
}

// Статическое знание о карте: видно всегда, сквозь туман (ГДД 7.4.3, F-4). Кому
// сейчас принадлежат клетки — только под зрением (MapState, Snapshot.cells).
// Позже здесь будут рудники и рельеф.
message MapDefinition {
  repeated Capital capitals = 1;  // по одной на фракцию
}

// Столица фракции. Клетки её зоны — круг: центры в пределах protected_radius
// клеток от центра клетки столицы — принадлежат фракции с начала сезона.
message Capital {
  uint32 faction_id = 1;
  uint32 cell = 2;              // индекс клетки: row * map_width + col
  uint32 protected_radius = 3;  // радиус зоны в клетках: 4
}

// Правила и темп игры. Клиент не хардкодит ни одно из этих чисел.
message GameConfig {
  uint32 tick_rate = 1;              // тиков симуляции в секунду: 60
  uint32 snapshot_rate = 2;          // снапшотов в секунду: 20
  uint32 map_width = 3;              // клеток: 100
  uint32 map_height = 4;             // клеток: 100
  uint32 move_speed = 5;             // единиц в секунду: 300 = 3 клетки/с
  uint32 max_hp = 6;                 // 100
  reserved 7, 8;                     // были attack_range и attack_cooldown_ticks: теперь в Ability
  reserved "attack_range", "attack_cooldown_ticks";
  uint32 respawn_delay_ticks = 9;    // 300 = 5 с
  uint32 reconnect_grace_ms = 10;    // сколько персонаж остаётся в мире после разрыва: 30000
  uint32 player_radius = 11;         // радиус тела игрока для попаданий ударом и снарядами, единиц: 16
}

// Способность на панели 1–5. Набор, порядок и числа задаёт сервер.
message Ability {
  uint32 id = 1;                 // ≥ 1; на него ссылается InputFrame.ability_id
  AbilityKind kind = 2;
  string name = 3;               // «Удар», «Выстрел»
  uint32 cooldown_ticks = 4;     // общая перезарядка после применения: 45 = 0,75 с; 90 = 1,5 с
  uint32 damage = 5;             // урон за попадание
  uint32 range = 6;              // единиц: радиус удара (MELEE) или дальность полёта (PROJECTILE)
  uint32 projectile_speed = 7;   // PROJECTILE: скорость снаряда, единиц в секунду
  uint32 projectile_radius = 8;  // PROJECTILE: радиус снаряда, единиц
  uint32 duration_ticks = 9;     // BLOCK: сколько тиков длится блок: 9 = 0,15 с
}

enum AbilityKind {
  ABILITY_KIND_UNSPECIFIED = 0;
  ABILITY_KIND_MELEE = 1;       // удар по всем врагам, чьё тело в радиусе range вокруг игрока
  ABILITY_KIND_PROJECTILE = 2;  // снаряд в сторону прицела; летит range единиц, от него можно увернуться
  ABILITY_KIND_BLOCK = 3;       // duration_ticks тиков игрок не получает урона ни от удара, ни от
                                //   снаряда; своя перезарядка, не общая с атаками
}

message Faction {
  uint32 id = 1;     // 1..255; 0 = нейтральная клетка или фракция не выбрана
  string name = 2;   // «Орда»
  uint32 color = 3;  // 0xRRGGBB
}

// ============================================================================
// Мир: территория и список игроков
// ============================================================================

// Полное состояние территории, каким его знает фракция получателя. Приходит
// сразу после Welcome и ещё раз после первого появления в мире (фракция выбрана);
// может прийти снова в любой момент — тогда клиент заменяет карту целиком.
// Под туманом (ГДД 7.4, F-3): у фракции одно зрение и одна память. Исследованные
// ею клетки (explored) — с владельцем, каким фракция видела его в последний раз;
// захваты — только у видимых сейчас; у остальных клеток 0 — значение неизвестно.
// Без фракции не исследовано ничего. Что видно сейчас, сообщает Snapshot.revealed;
// дальше память растёт дельтами Snapshot.revealed / hidden.
message MapState {
  uint32 tick = 1;
  bytes owner_faction_ids = 2;       // map_width * map_height байт по строкам; байт = faction id
  repeated CellUpdate captures = 3;  // клетки, где сейчас идёт захват
  bytes explored = 4;                // исследованные фракцией клетки: бит i % 8 байта i / 8
                                     //   (младший бит первый); пусто — ничего
}

// Полное (не разностное) состояние клетки: повторное применение ничего не ломает.
message CellUpdate {
  uint32 index = 1;               // y * map_width + x
  uint32 owner_faction_id = 2;    // фракция-владелец; 0 = нейтральная
  uint32 capture_faction_id = 3;  // фракция, которая захватывает; 0 = никто
  uint32 capture_progress = 4;    // 0..100 — процент захвата в пользу capture_faction_id
}

// Редко меняющиеся данные игрока.
message PlayerInfo {
  uint32 id = 1;
  string name = 2;
  uint32 faction_id = 3;  // закреплена при первом появлении (на сезон); 0 = ещё не появлялся
}

// Изменения списка игроков в сети. Первый Roster после Welcome содержит всех,
// включая самого получателя (full = true).
message Roster {
  repeated PlayerInfo upsert = 1;          // новые игроки и изменившиеся (первое появление: фракция)
  repeated uint32 removed_player_ids = 2;  // покинули мир: грейс-период после разрыва истёк
  bool full = 3;                           // true: upsert — полный список, клиент заменяет свой
                                           //   (после входа и при пересинхронизации, см. Snapshot.resync)
}

// Счёт фракций (ГДД 7.3, п. 8): реальный, по всей карте, а не по тому, что видно
// получателю, — туман его не скрывает. Сразу после входа (за Roster), затем раз
// в секунду всем. Каждый — полный: потерянный заменит следующий.
message FactionScores {
  repeated FactionScore scores = 1;  // по одной на фракцию, в порядке Welcome.factions
}

message FactionScore {
  uint32 faction_id = 1;
  uint32 cells = 2;   // клеток во владении фракции
  uint32 online = 3;  // её персонажей в мире — тех же, что в Roster (в т.ч. павших
                      //   и отошедших в грейс-период)
}

// ============================================================================
// Клиент → сервер: игровой процесс
// ============================================================================

// Первое появление и респавн. Разрешено в NOT_SPAWNED и в DEAD после
// SelfState.respawn_tick. Игрок появляется в центре клетки столицы своей фракции
// (Welcome.map); выбрать другую точку нельзя (до крепостей). Фракция выбирается
// при первом появлении и закрепляется за персонажем на сезон; другая в следующих
// запросах → INVALID_FACTION.
message SpawnRequest {
  reserved 1;             // была cell: место выбирал клиент
  reserved "cell";
  uint32 faction_id = 2;  // первое появление — выбор; дальше — только закреплённая
}

// Намерение игрока на один тик симуляции. Позицию клиент не присылает:
// только то, что игрок хочет сделать; результат считает сервер.
message InputFrame {
  uint32 input_seq = 1;      // 1, 2, 3… подряд в пределах соединения
  sint32 move_x = 2;         // направление; длину сервер нормирует до 1,
  sint32 move_y = 3;         //   (0, 0) = стоять
  bool attack = 4;           // держит клавишу атаки: пока перезарядка готова,
                             //   сервер применяет выбранную способность
  bool capturing = 5;        // держит клавишу захвата: сервер захватывает клетку
                             //   под центром игрока (1 захватчик ≈ capture_ticks)
  uint32 ability_id = 6;     // Ability.id выбранной способности; 0 = первая на панели
  sint32 aim_x = 7;          // прицел: направление от центра игрока, длина любая
  sint32 aim_y = 8;          //   (сервер нормирует); (0, 0) = нет прицела, снаряд не вылетает
}

// Кадры ввода по возрастанию input_seq: обычно один, после долгого кадра
// отрисовки — несколько накопившихся, не больше 8. Лишние кадры сервер
// отбрасывает (не ошибка); он же держит в очереди игрока не больше 32 кадров
// (game.limits в конфиге сервера).
message Input {
  repeated InputFrame frames = 1;
}

message Ping {
  uint32 client_time_ms = 1;  // часы клиента (performance.now()); вернутся в Pong
  // Отчёт клиента для метрик сервера (плейтесты, PT-0); 0 — сообщить нечего.
  uint32 rtt_ms = 2;          // последний измеренный RTT; 0 — ещё не измерен
  uint32 corrections = 3;     // коррекции предсказания с прошлого Ping (больше порога клиента)
  uint32 max_correction = 4;  // самая большая из них, единицы мира
}

// ============================================================================
// Сервер → клиент: игровой процесс
// ============================================================================

// Мир на тике tick. 20 раз в секунду, отдельно каждому клиенту — с учётом
// тумана войны (см. шапку файла).
message Snapshot {
  uint32 tick = 1;
  SelfState you = 2;                 // видно только получателю
  repeated PlayerState players = 3;  // все видимые игроки, включая себя; нет в списке = не видно
  repeated CellUpdate cells = 4;     // видимые клетки: изменившиеся после предыдущего
                                     //   снапшота и все из revealed (их актуальное состояние)
  repeated GameEvent events = 5;     // события после предыдущего снапшота, чьи игроки видны
  repeated ProjectileState projectiles = 6;  // видимые снаряды в полёте
  repeated uint32 revealed = 7;      // индексы клеток, вошедших в зону видимости
  repeated uint32 hidden = 8;        // индексы клеток, ушедших в туман: их состояние
                                     //   больше не обновляется, клиент хранит последнее известное
  bool resync = 9;                   // пересинхронизация: сервер потерял кадр к клиенту.
                                     //   Клиент сначала переводит все видимые клетки в
                                     //   исследованные, затем применяет revealed — все видимые
                                     //   сейчас клетки, их состояние в cells. Исследованное не
                                     //   теряется. Перед таким снапшотом приходит Roster{full}
}

// Публичное состояние игрока: всё, что нужно для отрисовки.
message PlayerState {
  uint32 id = 1;
  uint32 x = 2;   // единицы, 0 .. map_width * 100 - 1
  uint32 y = 3;   // единицы, 0 .. map_height * 100 - 1
  uint32 hp = 4;  // 0 = мёртв: тело лежит на месте смерти до респавна
}

// Снаряд в полёте: всё, что нужно для отрисовки.
message ProjectileState {
  uint32 id = 1;
  uint32 x = 2;           // единицы
  uint32 y = 3;
  uint32 faction_id = 4;  // фракция стрелка (цвет)
  sint32 vx = 5;          // скорость, единиц в секунду: направление полёта и след
  sint32 vy = 6;
  // Выпущен получателем снапшота: свой выстрел клиент рисует без задержки
  // интерполяции, от последнего снапшота по скорости. Чей чужой снаряд, не
  // сообщается: стрелок в тумане остаётся неизвестным (ГДД 16.11).
  bool mine = 7;
}

// Приватное состояние получателя снапшота.
message SelfState {
  LifeState life = 1;
  uint32 last_input_seq = 2;     // последний InputFrame.input_seq, который сервер обработал
  uint32 respawn_tick = 3;       // при DEAD: с этого тика примут SpawnRequest
  uint32 attack_ready_tick = 4;      // с этого тика возможна следующая атака
  uint32 attack_cooldown_ticks = 5;  // длина текущей перезарядки (от применённой способности)
  uint32 block_ready_tick = 6;       // с этого тика возможен следующий блок (своя перезарядка)
  uint32 block_cooldown_ticks = 7;   // длина текущей перезарядки блока
}

enum LifeState {
  LIFE_STATE_UNSPECIFIED = 0;
  LIFE_STATE_NOT_SPAWNED = 1;  // в сети, но ещё не выбрал точку появления
  LIFE_STATE_ALIVE = 2;
  LIFE_STATE_DEAD = 3;         // ждёт respawn_tick, затем SpawnRequest
}

// Разовые события для анимаций и ленты боя («TAG ранил SKAL −18»).
// Правда о состоянии — в PlayerState и SelfState; потеря события ничего не ломает.
message GameEvent {
  uint32 tick = 1;
  oneof kind {
    HitEvent hit = 2;
    DeathEvent death = 3;
    AbilityEvent ability = 4;
  }
}

// Игрок применил способность: удар (даже мимо), блок, выстрел — для анимации у всех.
message AbilityEvent {
  uint32 player_id = 1;
  uint32 ability_id = 2;  // Ability.id
}

message HitEvent {
  uint32 attacker_id = 1;
  uint32 target_id = 2;
  uint32 damage = 3;
  bool blocked = 4;  // удар или снаряд пришёлся в блок: damage = 0
}

message DeathEvent {
  uint32 victim_id = 1;
  uint32 killer_id = 2;  // 0 = смерть не от игрока
}

message Pong {
  uint32 client_time_ms = 1;  // эхо из Ping: RTT = сейчас − client_time_ms
  uint32 server_tick = 2;
}

// ============================================================================
// Ошибки
// ============================================================================

// fatal = true: сразу после этого сообщения сервер закрывает WebSocket
// с кодом 4000 + code. fatal = false: запрос отклонён, соединение живёт.
message ServerError {
  ErrorCode code = 1;
  bool fatal = 2;
  uint32 request_id = 3;  // ClientMessage.request_id, вызвавший ошибку; 0 = не привязана
  string detail = 4;      // для логов и отладки, игроку не показывать
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;

  // 1–19: соединение и протокол — всегда fatal.
  ERROR_CODE_PROTOCOL_VERSION = 1;    // версия клиента не поддерживается
  ERROR_CODE_BAD_MESSAGE = 2;         // не декодируется, текстовый кадр, больше 1 КиБ
  ERROR_CODE_UNEXPECTED_MESSAGE = 3;  // не в том состоянии: Input до Hello, второй Hello
  ERROR_CODE_HANDSHAKE_TIMEOUT = 4;   // нет Hello за 5 с после открытия сокета
  ERROR_CODE_IDLE_TIMEOUT = 5;        // от клиента ничего не приходило 20 с (любое
                                      //   сообщение продлевает: клиент шлёт Ping раз в 2 с)
  ERROR_CODE_RATE_LIMITED = 6;        // больше 120 сообщений в секунду (всплеск до 120 —
                                      //   можно); числа — game.limits в конфиге сервера
  ERROR_CODE_INVALID_NAME = 7;        // имя не проходит правила или уже занято (без учёта регистра)
  ERROR_CODE_SERVER_FULL = 8;
  ERROR_CODE_SESSION_REPLACED = 9;    // персонажа с этим токеном перехватило другое соединение
                                      //   (другая вкладка)
  ERROR_CODE_SERVER_SHUTDOWN = 10;
  ERROR_CODE_KICKED = 11;
  ERROR_CODE_INTERNAL = 12;

  // 20+: отказ в конкретном запросе — никогда не fatal.
  ERROR_CODE_UNSUPPORTED_MESSAGE = 20;  // пустой или неизвестный серверу payload
  reserved 21, 22;                      // были SPAWN_INVALID_CELL и SPAWN_FORBIDDEN: клетку
  reserved "ERROR_CODE_SPAWN_INVALID_CELL", "ERROR_CODE_SPAWN_FORBIDDEN";  // выбирал клиент
  ERROR_CODE_SPAWN_TOO_EARLY = 23;      // respawn_tick ещё не наступил
  ERROR_CODE_ALREADY_SPAWNED = 24;      // игрок уже жив
  ERROR_CODE_INVALID_FACTION = 25;      // нет такой фракции, у неё нет столицы или
